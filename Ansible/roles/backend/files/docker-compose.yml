
services:
  backend:
    image: mahmoudeng/white-backend:v1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided at runtime}
    networks:
      - white-network

  nginx:
    image: mahmoudeng/white-nginx:v1
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - white-network

networks:
  white-network:
    driver: bridge